parameters:
  - name: nightly
    type: boolean

variables:
- template: /eng/docker-tools/templates/variables/common.yml@self

- template: /eng/pipeline/variables/pipeline.yml@self

# Publish EOL annotations for MAR/MCR.
# (.NET Docker uses an Azure Pipelines UI variable.)
- name: publishEolAnnotations
  value: true

# Configure the build, test (N/A), and publish process.
# Only necessary variables, in order of presentation in .NET Docker Tools.

## General config. Overrides: eng/docker-tools/templates/variables/common.yml

# Don't publish readme: Microsoft images aren't on Docker Hub.
- name: publishReadme
  value: false
# No Kusto ingestion. Requires more auth: https://github.com/microsoft/go/issues/192
- name: ingestKustoImageInfo
  value: false

- name: officialBranches
  # list multiple branches as "'branch1', 'branch2', etc."
  ${{ if eq(parameters.nightly, false) }}:
    value: microsoft/main
  ${{ if eq(parameters.nightly, true) }}:
    value: microsoft/nightly

- ${{ if eq(variables['System.TeamProject'], 'internal') }}:
  - ${{ if eq(parameters.nightly, false) }}:
    - group: go-docker-common-2
  - ${{ if eq(parameters.nightly, true) }}:
    - group: go-docker-common-nightly

# Overrides based on: eng/docker-tools/templates/variables/dotnet/build-test-publish.yml

- name: publicGitRepoUri
  value: https://github.com/microsoft/go

- name: officialRepoPrefixes
  ${{ if eq(parameters.nightly, false) }}:
    # Publish to "public/" or "private/internal/". Tags under these repo prefixes will be detected
    # by MAR triggers and publish our images on the associated registry.
    value: public/,private/internal/
  ${{ else }}:
    # In the nightly branch, publish to ACR only. The prefix doesn't need to match MAR expectations.
    value: nightly/

- name: gitHubVersionsRepoInfo.org
  value: microsoft
- name: gitHubVersionsRepoInfo.repo
  value: go-images-versions
- name: gitHubVersionsRepoInfo.branch
  value: main
- name: gitHubVersionsRepoInfo.path
  value: go-images
- name: gitHubVersionsRepoInfo.userName
  value: bot-for-go[bot]
- name: gitHubVersionsRepoInfo.email
  # App's user id: https://api.github.com/users/bot-for-go%5Bbot%5D
  value: 199222863+$(gitHubVersionsRepoInfo.userName)@users.noreply.github.com
