parameters:
  - name: nightly
    type: boolean
    default: false

variables:

- ${{ if eq(variables['System.TeamProject'], 'internal') }}:
  - group: Microsoft-GoLang-bot

# See /eng/docker-tools/templates/variables/dotnet/secrets.yml

# Credentials for pulling base images from Docker Hub.
- name: dockerHubRegistryCreds
  value: --registry-creds 'docker.io=$(dotnetDockerHubBot.userName);$(BotAccount-dotnet-dockerhub-bot-PAT)'

- name: gitHubVersionsRepoInfo.authArgs
  value: >-
    --gh-private-key '$(GitHubApp-bot-for-go-private-key-pem)'
    --gh-app-client-id '$(GitHubApp-bot-for-go-client-id)'
    --gh-app-installation-id '$(GitHubApp-bot-for-go-microsoft-installation-id)'

# Mappings from Go auth storage to .NET Docker terms based on
# DotNet-Docker-Common-2 variable group.
- name: acr.password
  ${{ if eq(parameters.nightly, false) }}:
    value: $(BotAccount-golang-docker-acr-bot-password)
  ${{ if eq(parameters.nightly, true) }}:
    value: $(BotAccount-golang-docker-acr-public-bot-password)
- name: acr.servicePrincipalPassword
  value: $(GolangDockerBuild)
